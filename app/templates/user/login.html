{% extends 'user/base.html' %}

{% block title %}Đăng nhập - Thư Viện Minh{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-icon">
            <i class="bi bi-person-fill"></i>
        </div>
        <h2 class="login-title">Chào mừng trở lại</h2>
        <p class="login-subtitle">Đăng nhập để mượn và quản lý sách của bạn</p>

        <form action="{{ url_for('login_process') }}" method="POST">
            <div class="form-group-custom">
                <label for="username">Tên đăng nhập</label>
                <div class="input-wrapper">
                    <i class="bi bi-person input-icon"></i>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Nhập tên đăng nhập" required>
                </div>
            </div>
            <div class="form-group-custom">
                <label for="password">Mật khẩu</label>
                <div class="input-wrapper">
                    <i class="bi bi-lock input-icon"></i>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required>
                </div>
            </div>
            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-right"></i> Đăng nhập
            </button>
        </form>

        <div class="register-footer">
            <p>Chưa có tài khoản? <a href="{{ url_for('register_view') }}" class="link-accent">Đăng ký ngay</a></p>
        </div>
    </div>
</div>
{% endblock %}
